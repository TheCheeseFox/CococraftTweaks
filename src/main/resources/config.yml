# ===== ServerTweaks - configuracion =====

# Fondos para los contenedores vanilla.
# Pega el CARACTER del glyph de Nexo entre las comillas. Puedes anteponer
# tus espacios negativos para centrar la imagen, igual que en tus menus.
# Deja "" (vacio) para no tocar ese tipo de contenedor.
chest-backgrounds:
  single: ""   # cofre simple (3 filas)
  double: ""   # cofre doble (6 filas)
  ender: ""    # ender chest

# Comando que se ejecuta al ABRIR la pantalla de avances vanilla.
advancements:
  enabled: true
  # %player% = nombre del jugador. Se ejecuta como CONSOLA.
  # Ejemplo: "cmi sound entity.player.levelup %player%"
  command: ""
