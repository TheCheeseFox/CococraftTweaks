name: Build CococraftTweaks
 
# Se dispara al hacer push a la rama principal (ajusta el nombre si la tuya
# es "master" u otra), ignorando cambios solo de documentacion. Tambien se
# puede lanzar a mano desde la pestana "Actions".
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      # JDK 25 (Temurin) para que coincida con el runtime de tu servidor y con
      # el paper-api 26.1.x. "cache: maven" acelera builds siguientes.
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
 
      # DeluxeMenus no esta en un repo Maven publico estable, asi que descargamos
      # su .jar YA COMPILADO y lo instalamos en el Maven local del runner.
      # Usamos la API de Modrinth: pedimos la lista de versiones, filtramos a
      # "release", tomamos la mas reciente por fecha y bajamos su .jar. Asi no
      # hay que hardcodear el numero de version (nada de 404 por adivinar).
      # La API que usamos en el codigo (Menu.getMenuByName / openMenu) es estable
      # entre versiones recientes, asi que la ultima release sirve para compilar.
      - name: Download & install DeluxeMenus dependency
        run: |
          set -e
 
          echo "== Obteniendo la ultima release de DeluxeMenus desde Modrinth =="
          DM_URL=$(curl -fsSL "https://api.modrinth.com/v2/project/deluxemenus/version" \
            | jq -r 'map(select(.version_type=="release")) | sort_by(.date_published) | last | .files[0].url')
 
          if [ -z "$DM_URL" ] || [ "$DM_URL" = "null" ]; then
            echo "ERROR: no se pudo obtener la URL de descarga de DeluxeMenus"
            exit 1
          fi
          echo "URL de descarga: $DM_URL"
 
          echo "== Descargando el jar =="
          curl -fSL -o deluxemenus.jar "$DM_URL"
 
          echo "== Verificando que es un .jar valido =="
          file deluxemenus.jar
          unzip -l deluxemenus.jar > /dev/null
 
          # La version aqui (1.14.0) es solo una ETIQUETA local de Maven; tiene
          # que coincidir con la <version> de DeluxeMenus en tu pom.xml, no con
          # la version real del jar. Por eso el pom NO necesita cambios.
          echo "== Instalando en el Maven local del runner =="
          mvn -B -q install:install-file \
            -Dfile=deluxemenus.jar \
            -DgroupId=com.extendedclip.deluxemenus \
            -DartifactId=DeluxeMenus \
            -Dversion=1.14.1 \
            -Dpackaging=jar
 
      - name: Build with Maven
        run: mvn -B clean package
 
      # El jar sale como artifact del run; lo descargas desde la pagina de Actions.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CococraftTweaks
          path: target/CococraftTweaks.jar
          if-no-files-found: error
