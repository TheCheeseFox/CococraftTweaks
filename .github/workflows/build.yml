name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar con Maven
        run: mvn -B package
      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: CococraftTweaks
          path: target/CococraftTweaks.jar
